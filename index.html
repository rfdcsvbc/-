<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080711">
<meta name="description" content="把月光、星河和一点点好运，打包送给你。中秋快乐！">
<title>月亮圆了，快乐加倍 · 中秋快乐</title>
<style>
:root{color-scheme:dark;--gold:#ffd77b;--cream:#fff5d9;--ink:#080711}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:var(--ink)}
body{font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#fff;min-height:100svh;min-height:100dvh;isolation:isolate}
body:before,body:after{content:"";position:fixed;inset:-30%;z-index:-3;pointer-events:none;filter:blur(65px);opacity:.52;transform:translate3d(0,0,0)}
body:before{background:radial-gradient(ellipse at 18% 32%,#30206f88,transparent 38%),radial-gradient(ellipse at 72% 23%,#40236677,transparent 38%),radial-gradient(ellipse at 55% 78%,#171b6388,transparent 42%);animation:nebulaA 22s ease-in-out infinite alternate}
body:after{z-index:-2;background:radial-gradient(ellipse at 78% 56%,#51206c55,transparent 34%),radial-gradient(ellipse at 24% 75%,#152d6966,transparent 38%);animation:nebulaB 28s ease-in-out infinite alternate}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.scene{position:relative;display:grid;place-items:center;min-height:100svh;min-height:100dvh;padding:clamp(26px,6vh,72px) 22px max(28px,env(safe-area-inset-bottom));overflow:hidden;text-align:center}
.moon{position:absolute;z-index:-1;width:min(78vw,430px);aspect-ratio:1;top:clamp(54px,13vh,130px);left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 36% 31%,#fff4d1 0,#ffe8a6 23%,#f2c45f 55%,#cc8534 78%,#8d4b43 100%);box-shadow:0 0 24px 5px #ffdf9a99,0 0 80px 26px #ffc66a66,0 0 170px 70px #f99f4366,inset -22px -18px 42px #95463c77;animation:moonPulse 5.5s ease-in-out infinite}
.moon:before{content:"";position:absolute;inset:-43%;border-radius:50%;background:conic-gradient(from 15deg,transparent 0deg,transparent 304deg,#ffe8b412 322deg,#fff0cd55 330deg,#ffe8b40b 339deg,transparent 351deg);filter:blur(8px);animation:raySweep 18s linear infinite}
.moon:after{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(ellipse at 72% 58%,#c9854430,transparent 17%),radial-gradient(ellipse at 42% 72%,#c9854422,transparent 12%),radial-gradient(ellipse at 67% 31%,#c9854424,transparent 9%);mix-blend-mode:multiply}
.content{position:relative;width:min(100%,620px);margin-top:clamp(80px,20vh,205px);padding:0 8px 24px;animation:riseIn 1.1s cubic-bezier(.2,.75,.25,1) both}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#ffe2a3;font-size:11px;letter-spacing:.36em;font-weight:700;text-shadow:0 0 15px #ffc65e99;margin-bottom:16px;opacity:0;animation:fadeIn 1s 1.1s forwards}
.eyebrow:before,.eyebrow:after{content:"";width:20px;height:1px;background:linear-gradient(90deg,transparent,#ffcf70)}.eyebrow:after{transform:scaleX(-1)}
h1{position:relative;margin:0 auto;min-height:1.35em;font-size:clamp(42px,12vw,76px);line-height:1.15;letter-spacing:.08em;font-weight:900;color:#fff9e9;background:linear-gradient(180deg,#fff 10%,#fff5dc 44%,#f4ce80 72%,#fffaf0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 7px #fff8db99) drop-shadow(0 0 22px #ffca6ac9);text-shadow:0 0 0 transparent}
h1:after{content:"";position:absolute;top:-12%;bottom:-12%;left:-35%;width:27%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,#fff9dfaa,transparent);filter:blur(4px);opacity:0;pointer-events:none}
h1.sweep:after{opacity:1;animation:titleSweep 2.2s ease-in-out 1}
.subtitle{margin:13px 0 0;color:#ffe6af;font-size:clamp(15px,4.2vw,19px);letter-spacing:.18em;font-weight:600;text-shadow:0 0 16px #ffd26c99;opacity:0;transform:translateY(9px);transition:opacity 1.2s ease,transform 1.2s ease}
.subtitle.show{opacity:1;transform:translateY(0)}
.divider{width:92px;height:1px;margin:23px auto 19px;background:linear-gradient(90deg,transparent,#f9d687,#fff2c2,#f9d687,transparent);box-shadow:0 0 12px #ffd77b88;opacity:0;animation:fadeIn 1.3s 4s forwards}
.message{margin:0 auto;max-width:440px;color:#f6e9d4;font-size:clamp(14px,3.8vw,17px);line-height:2;letter-spacing:.045em;text-shadow:0 2px 16px #0009;opacity:0;animation:fadeIn 1.5s 4.1s forwards}
.message strong{color:#ffe0a0;font-weight:700;text-shadow:0 0 12px #ffca6288}
.signature{margin:16px 0 0;color:#d7c9ed;font-size:12px;letter-spacing:.22em;opacity:0;animation:fadeIn 1.4s 4.6s forwards}
.hint{position:absolute;bottom:max(21px,env(safe-area-inset-bottom));left:0;right:0;margin:auto;color:#e5d8c6a6;font-size:11px;letter-spacing:.16em;opacity:0;animation:fadeIn 1s 5s forwards}
.hint span{display:inline-block;margin-right:5px;color:#ffd77b;animation:tapPulse 1.8s ease-in-out infinite}
.type-caret{display:inline-block;width:2px;height:.83em;background:#ffe6ab;vertical-align:-.04em;margin-left:5px;box-shadow:0 0 9px #ffd77b;animation:blink .8s steps(2) infinite}
@keyframes nebulaA{to{transform:translate3d(6%,3%,0) scale(1.1) rotate(5deg)}}@keyframes nebulaB{to{transform:translate3d(-5%,-4%,0) scale(1.14) rotate(-7deg)}}
@keyframes moonPulse{0%,100%{filter:brightness(.92);box-shadow:0 0 24px 5px #ffdf9a88,0 0 75px 23px #ffc66a55,0 0 150px 62px #f99f4355,inset -22px -18px 42px #95463c77}50%{filter:brightness(1.15);box-shadow:0 0 34px 8px #ffefc0cc,0 0 105px 38px #ffc66a88,0 0 205px 84px #f99f4377,inset -22px -18px 42px #95463c55}}
@keyframes raySweep{to{transform:rotate(360deg)}}@keyframes titleSweep{0%{left:-35%}75%,100%{left:125%;opacity:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}@keyframes blink{to{opacity:0}}@keyframes tapPulse{50%{transform:scale(1.28);text-shadow:0 0 12px #ffd77b}}
@media(max-height:680px){.moon{width:min(58vw,290px);top:5vh}.content{margin-top:clamp(54px,14vh,115px)}.divider{margin:15px auto 12px}.subtitle{margin-top:8px}.signature{margin-top:9px}}
@media(min-width:700px){.scene{padding-top:8vh}.moon{top:10vh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="scene">
  <div class="moon" aria-hidden="true"></div>
  <section class="content" aria-label="中秋祝福">
    <div class="eyebrow">月光正好 · 思念有声</div>
    <h1 id="title" aria-label="中秋快乐"><span id="typed"></span><i class="type-caret" id="caret" aria-hidden="true"></i></h1>
    <p class="subtitle" id="subtitle">月亮圆了，快乐也要加倍呀</p>
    <div class="divider"></div>
    <p class="message">祝同学们假期<strong>吃好、睡好、玩得好</strong>，<br>烦恼统统靠边站，好运一路跟着跑！<br>愿我们抬头有月光，低头有快乐，<br><strong>团团圆圆，天天都闪闪发光。</strong></p>
    <p class="signature">把这份月光，分你一半 ✦</p>
  </section>
  <div class="hint"><span>✦</span>轻触屏幕，让好运绽放</div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d',{alpha:true}),title=document.getElementById('title'),typed=document.getElementById('typed'),caret=document.getElementById('caret'),subtitle=document.getElementById('subtitle');
let w=0,h=0,dpr=1,stars=[],dust=[],petals=[],meteors=[],bursts=[],ripples=[],last=0,nextMeteor=0,nextBurst=0,elapsed=0;
const rand=(a,b)=>a+Math.random()*(b-a),gold=['#fff4cf','#ffe09a','#ffc85f','#fff9e8','#f3aa43'];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.max(100,Math.floor(w*h/4300))},()=>({x:rand(0,w),y:rand(0,h),r:rand(.45,1.8),p:rand(0,6.28),s:rand(1.8,7),a:rand(.25,.9)}));dust=Array.from({length:Math.max(45,Math.floor(w*h/9500))},()=>({x:rand(0,w),y:rand(0,h),r:rand(.8,2.3),vx:rand(-.18,.18),vy:rand(-.3,-.04),p:rand(0,6.28),gold:Math.random()<.78}));}
function petal(){const x=rand(-20,w+20);petals.push({x,y:rand(-h,0),vx:rand(-.45,.45),vy:rand(.42,1.65),rot:rand(0,6.28),vr:rand(-.025,.025),size:rand(4,9),a:rand(.42,.85),trail:Math.random()<.28});}
for(let i=0;i<Math.max(18,Math.min(42,Math.floor(innerWidth/11)));i++)petal();
function burst(x,y,n=22,power=1){for(let i=0;i<n;i++){const a=rand(0,6.283),v=rand(1.1,4.8)*power;bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(35,75),max:75,r:rand(1,3.2),c:gold[(Math.random()*gold.length)|0]})}}
let charIndex=0;const greeting=Array.from('中秋快乐');
function typeNext(){if(charIndex<greeting.length){typed.textContent+=greeting[charIndex++];const r=title.getBoundingClientRect();burst(r.left+r.width*(charIndex/(greeting.length+1)),r.top+r.height*.56,17,1.1);setTimeout(typeNext,410)}else{caret.style.display='none';subtitle.classList.add('show');title.classList.add('sweep');setInterval(()=>{title.classList.remove('sweep');void title.offsetWidth;title.classList.add('sweep')},5800);title.animate([{transform:'translateY(0)'},{transform:'translateY(-7px)'},{transform:'translateY(0)'}],{duration:4200,iterations:Infinity,easing:'ease-in-out'})}}
setTimeout(typeNext,650);
function starDraw(t){for(const s of stars){const tw=(Math.sin(t*s.s*.001+s.p)+1)/2,a=s.a*(.24+.76*tw);ctx.globalAlpha=a;ctx.fillStyle=tw>.89?'#fff7dc':'#e9dfff';ctx.beginPath();ctx.arc(s.x,s.y,s.r*(.65+tw*.5),0,6.283);ctx.fill();if(tw>.94){ctx.globalAlpha=a*.5;ctx.fillRect(s.x-3,s.y-.45,6,.9);ctx.fillRect(s.x-.45,s.y-3,.9,6)}}ctx.globalAlpha=1}
function meteorSpawn(){const x=rand(w*.48,w+80),y=rand(-30,h*.48),len=rand(100,230),speed=rand(8,15),angle=rand(2.25,2.55);meteors.push({x,y,px:x,py:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,len,life:0,max:rand(26,42),width:rand(1.2,2.7)});}
function drawMeteor(m){const fade=Math.min(1,m.life/5,(m.max-m.life)/11);const gx=m.x-m.vx*(m.len/Math.hypot(m.vx,m.vy)),gy=m.y-m.vy*(m.len/Math.hypot(m.vx,m.vy));const g=ctx.createLinearGradient(m.x,m.y,gx,gy);g.addColorStop(0,'#fffdf0');g.addColorStop(.12,'#ffe8ae');g.addColorStop(.48,'#ffca6a88');g.addColorStop(1,'#ffb74a00');ctx.globalAlpha=Math.max(0,fade);ctx.strokeStyle=g;ctx.lineWidth=m.width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(gx,gy);ctx.stroke();ctx.globalAlpha=1}
function drawPetal(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.a;ctx.fillStyle='#ffcc62';ctx.shadowColor='#ffbe51';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,-p.size);ctx.bezierCurveTo(p.size*.82,-p.size*.5,p.size*.68,p.size*.62,0,p.size);ctx.bezierCurveTo(-p.size*.7,p.size*.52,-p.size*.75,-p.size*.54,0,-p.size);ctx.fill();ctx.restore();ctx.globalAlpha=1}
function frame(now){const dt=Math.min(2,(now-last)/16.67||1);last=now;elapsed+=dt;ctx.clearRect(0,0,w,h);starDraw(now);
// A soft moving lunar beam across the sky.
const sx=(Math.sin(now*.00013)*.5+.5)*w;const beam=ctx.createLinearGradient(sx-80,0,sx+180,h);beam.addColorStop(0,'#e8c8ff00');beam.addColorStop(.48,'#ffd98108');beam.addColorStop(.52,'#e7d3ff13');beam.addColorStop(1,'#e8c8ff00');ctx.fillStyle=beam;ctx.fillRect(0,0,w,h);
if(now>nextMeteor){meteorSpawn();if(Math.random()<.28)setTimeout(meteorSpawn,rand(300,950));nextMeteor=now+rand(350,1050)}
for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.life+=dt;drawMeteor(m);if(m.life>m.max)meteors.splice(i,1)}
for(const p of dust){p.x+=p.vx*dt+Math.sin(now*.0008+p.p)*.12;p.y+=p.vy*dt;if(p.y<-10){p.y=h+10;p.x=rand(0,w)}const pulse=.45+.55*(Math.sin(now*.002+p.p)+1)/2;ctx.globalAlpha=.27*pulse;ctx.fillStyle=p.gold?'#ffcf68':'#d8c6ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.x+=p.vx*dt+Math.sin(now*.001+p.rot)*.4;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.trail){ctx.globalAlpha=.2;ctx.strokeStyle='#ffd77b';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*7,p.y-p.vy*6);ctx.stroke();ctx.globalAlpha=1}drawPetal(p);if(p.y>h+20){petals.splice(i,1);petal()}}
if(now>nextBurst){if(Math.random()<.84)burst(rand(w*.08,w*.92),rand(h*.12,h*.78),rand(11,24)|0,rand(.55,1));nextBurst=now+rand(900,2400)}
for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.984;b.vy*=.984;b.life-=dt;ctx.globalAlpha=Math.max(0,b.life/b.max);ctx.fillStyle=b.c;ctx.shadowColor=b.c;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();if(b.life<=0)bursts.splice(i,1)}ctx.globalAlpha=1;ctx.shadowBlur=0;
for(let i=ripples.length-1;i>=0;i--){const q=ripples[i];q.r+=5*dt;q.life-=dt;ctx.globalAlpha=Math.max(0,q.life/38);ctx.strokeStyle='#ffdc87';ctx.lineWidth=2;ctx.shadowColor='#ffd36b';ctx.shadowBlur=19;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.stroke();ctx.globalAlpha=1;if(q.life<=0)ripples.splice(i,1)}ctx.shadowBlur=0;requestAnimationFrame(frame)}
function pointer(e){const x=e.clientX,y=e.clientY;ripples.push({x,y,r:4,life:38});burst(x,y,Math.min(74,Math.max(38,Math.floor(w/8))),1.5)}
addEventListener('resize',resize,{passive:true});addEventListener('pointerdown',pointer,{passive:true});resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
